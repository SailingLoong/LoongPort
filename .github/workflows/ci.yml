name: CI

on:
  # 2026-08-02 曾因 Actions 额度用到 91%（1823/2000 分钟）把自动触发整个关掉，只留手动。
  # 2026-08-04 转开源后恢复 —— **public 仓的标准 runner 不计费**，那条约束不存在了。
  #
  # 更要紧的是：开源仓收 fork PR，而 PR 作者的本机不跑我们的六道闸（CLAUDE.md §四 那条
  # 「本机先全跑一遍」只约束得到维护者）⇒ **自动 CI 是外部改动唯一的验证点**，
  # 不是「防自己忘了跑」的冗余。别再为省额度关它。
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三平台全跑。**开源仓的 Actions 标准 runner 不计费**（不是额度更大，是压根不进
        # 计费）⇒ ubuntu 1× / windows 2× / macOS 10× 那套倍率对本仓不适用。
        #
        # 2026-08-02 曾为省额度去掉 macOS（当时是 private 仓，三平台一次 push 约 107 分钟、
        # macOS 独占 80，2000 分钟/月只够 18 次）。2026-08-04 转开源后加回来 —— 理由不是
        # 「现在免费了所以顺手多跑」，而是**当初的替代方案随开源失效了**：那时的论证是
        # 「只有 macOS 能验的 chatgpt_app.rs AppleScript 分支，维护者本机就是 macOS，
        # 六道闸本来就在本机先跑一遍」。开源后 PR 来自外部贡献者，他们的本机不一定是
        # macOS，「维护者本机会先跑」这个前提不再覆盖所有改动 ⇒ 那条分支必须由 CI 兜住。
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
