name: CI

on:
  # 2026-08-02 曾因 Actions 额度用到 91%（1823/2000 分钟）把自动触发整个关掉，只留手动。
  # 2026-08-04 转开源后恢复 —— **public 仓的标准 runner 不计费**，那条约束不存在了。
  #
  # 更要紧的是：开源仓收 fork PR，而 PR 作者的本机不跑我们的六道闸（CLAUDE.md §四 那条
  # 「本机先全跑一遍」只约束得到维护者）⇒ **自动 CI 是外部改动唯一的验证点**，
  # 不是「防自己忘了跑」的冗余。别再为省额度关它。
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    # Pushes to main always run everything: they keep the caches that PRs restore from warm.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # 跟 `.node-version` 走，别写死 —— 三个 workflow 曾经是三种写法
          # （这里与 release.yml 写死 20、windows-build.yml 读文件），
          # 于是 CI 验的、出包用的、贡献者本机装的可能是三个不同版本。
          node-version-file: .node-version

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      # remote-config 的 Pages Functions 有自己的 vitest 配置与 tsconfig（node 环境），
      # 根配置只收 src/ 与 tests/ —— 不加这步，observations 解析（吃不可信的
      # VeriDrop 排行榜 HTML）的测试与类型检查在 CI 都是零覆盖。
      - name: Remote-config typecheck
        run: pnpm --filter @loongport/remote-config exec tsc --noEmit

      - name: Remote-config tests
        run: pnpm --filter @loongport/remote-config exec vitest run

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 三平台全跑。**开源仓的 Actions 标准 runner 不计费**（不是额度更大，是压根不进
        # 计费）⇒ ubuntu 1× / windows 2× / macOS 10× 那套倍率对本仓不适用。
        #
        # 2026-08-02 曾为省额度去掉 macOS（当时是 private 仓，三平台一次 push 约 107 分钟、
        # macOS 独占 80，2000 分钟/月只够 18 次）。2026-08-04 转开源后加回来 —— 理由不是
        # 「现在免费了所以顺手多跑」，而是**当初的替代方案随开源失效了**：那时的论证是
        # 「只有 macOS 能验的 chatgpt_app.rs AppleScript 分支，维护者本机就是 macOS，
        # 六道闸本来就在本机先跑一遍」。开源后 PR 来自外部贡献者，他们的本机不一定是
        # macOS，「维护者本机会先跑」这个前提不再覆盖所有改动 ⇒ 那条分支必须由 CI 兜住。
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  backend-windows-wsl2:
    name: Backend Checks (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 45
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path,
        # 所以 cargo（构建）只允许出现在这一步。顺带解析出 lib 测试二进制的路径，
        # 跑测步直接执行它 —— cargo 不再进入 WSL TEMP 环境，任何原因触发的重链
        # 都碰不到 mt.exe（2026-08-16 main 实红：--no-run 刚编完，跑测步的
        # --list 又无端重编一次，重链恰好踩中 UNC manifest 坑，且失败在重试
        # 循环之外；#148 分支同 workflow 则完全没重编 —— 指纹抖动不可依赖）。
        shell: pwsh
        run: |
          $output = cargo test --lib --manifest-path src-tauri/Cargo.toml --no-run 2>&1
          $output | Write-Host
          # `--lib` 恰好产生一行 "Executable unittests src/lib.rs (…exe)"
          $m = $output | Select-String -Pattern 'Executable unittests src/lib\.rs \((.+\.exe)\)' | Select-Object -First 1
          if (-not $m) { throw "cargo 输出里没有 lib 测试二进制路径" }
          $rel = $m.Matches[0].Groups[1].Value
          $exe = if ([IO.Path]::IsPathRooted($rel)) { $rel } else { Join-Path $pwd.Path $rel }
          "CC_SWITCH_TEST_BIN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        # 直接执行上一步编好的测试二进制：契约本身要求 TEMP/HOME 落在 WSL UNC
        # 上（测试断言 temp_dir() 也在测试根下），而 cargo 在这种环境里一旦
        # 重链就会踩 mt.exe 的 LNK1327。二进制不经 cargo 运行后，链接器彻底
        # 不出现，原来的重试循环随之删除（它兜的就是这个链接坑）。
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $exe = $env:CC_SWITCH_TEST_BIN
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $exe --ignored --list
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $exe --ignored --exact --nocapture $testName
          exit $LASTEXITCODE

  # ⚠️ **分支保护的必需检查只认这一个 job**（名字见 name:），别再改成四个矩阵名。
  #
  # 为什么必须有个门卫 job：`changes` 过滤会让无关 job 走 skipped，而 skipped 的
  # 矩阵 job 上报的名字与运行时不同（`Backend Checks` vs `Backend Checks (ubuntu-22.04)`）
  # ⇒ 必需检查永远等不齐 ⇒ automerge 死锁（PR #130 踩过，只能 --admin 解锁）。
  # GitHub 官方建议也是「必需检查不要被跳过」—— 门卫 always 跑、把 skipped 当作
  # 「过滤说不相关」放行，failure/cancelled 仍然拦下。
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend, backend, backend-windows-wsl2]
    steps:
      - name: Gate on upstream results
        shell: bash
        run: |
          failed=0
          for result in $(printf '%s\n' ${{ join(needs.*.result, ' ') }}); do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::upstream job ended as '$result' (failure/cancelled are hard failures; skipped means the path filter deemed it irrelevant)"
                failed=1
                ;;
            esac
          done
          exit $failed
