name: CI

on:
  # ⏸ **自动触发临时关闭**（2026-08-02）——  Actions 额度本计费周期已用 91%
  # （1823/2000 分钟），9 月 1 日重置。原来的 `push` + `pull_request` 各触发一次，
  # 一次约 27 分钟（去掉 macOS 格之后；之前是 107），剩余额度撑不到重置。
  #
  # 关掉不等于不验：六道闸本来就要求本机先全跑一遍（见 CLAUDE.md §四），
  # CI 的作用是兜住「本机验不了的平台」—— 目前只剩 windows 那格有独立价值。
  # 需要时用下面的 workflow_dispatch 手动点一次（Actions 页 → CI → Run workflow）。
  #
  # ⚠️ **恢复条件：额度重置（2026-09-01）之后就把下面两行取消注释**。
  # 别让「临时」变成永久 —— 自动 CI 是防「本机忘了跑闸就推」的唯一防线，
  # 而那种事迟早会发生。
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ **macos-latest 有意不在这里**（2026-08-02 去掉）。
        #
        # GitHub Actions 的计费倍率：ubuntu 1× / windows 2× / **macOS 10×**。
        # 三平台矩阵一次 push 约 107 分钟额度，其中 macOS 那格独占 80（76%）——
        # 2000 分钟/月的额度按这个烧法只够 18 次 push，实测一个月就用到 91%。
        #
        # 去掉它损失多少：几乎为零。cargo test / clippy / fmt 在三个平台上验的是同一套
        # 代码，真正只有 macOS 能验的是 chatgpt_app.rs 的 AppleScript 分支，而那部分
        # **维护者本机就是 macOS，六道闸本来就在本机先跑一遍**（见 CLAUDE.md §四）。
        # windows-latest 留着，因为那些 `#[cfg(target_os = "windows")]` 分支本机验不了
        # （踩过：6f027168 修的 6 个 dead_code 就只有 CI 的 windows 格能发现）。
        #
        # 打 tag 出包时 release.yml 仍会在 macOS 上真正编译，所以「能不能在 mac 上构建」
        # 这件事没有失去覆盖 —— 失去的只是「每次 push 都重复验一遍」。
        os: [ubuntu-22.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
