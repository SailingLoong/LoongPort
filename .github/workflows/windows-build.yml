# 不打 tag 也能出一个 Windows 安装包 —— 拿任意分支的代码给人试用时用它。
#
# **与 `release.yml` 的分工**：那个由 tag 触发，出全平台产物并建 GitHub Release；
# 这个只手动触发、只出 Windows msi，不建 Release、不碰 tag。
# （两者在零 secrets 下都能跑绿 —— 2026-08-04 用 `v3.19.2-rc.1` 演练验过。）
#
# 不签名的代价：用户第一次运行会看到 SmartScreen 的「未知发布者」警告，要点「更多信息 →
# 仍要运行」。给朋友试用可以接受；真要对外发布得另配代码签名证书。
name: Windows Build

on:
  # **只手动触发。** 出包是个有意的动作，不该每次 push 都烧 CI 额度；
  # 打 tag 那条路归 `release.yml` —— 它已经出 msi + 免安装版、x64 + arm64 四个产物，
  # 这个 workflow 再跟着 tag 跑一遍就是白编两次 Windows（实测 17 分钟起）。
  workflow_dispatch:
    inputs:
      arch:
        description: 目标架构
        type: choice
        default: x64
        options: [x64, arm64, both]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 把「要出哪几个架构」算成一个 JSON 数组给下面的 matrix 用。
  #
  # 为什么不在 job 级 `if` 里判：**`matrix` 在那个上下文里不可用**（GitHub Actions 会报
  # `Unrecognized named-value: 'matrix'`）—— job 级 `if` 在展开矩阵之前求值。所以过滤必须
  # 发生在矩阵**生成**的时候，而不是生成之后。
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        env:
          # 经 env 传而不是直接插进脚本 —— 这是 workflow 注入的标准防线。
          # 这里的值本身受 `type: choice` 约束（只能是那三个），但形式上仍照规矩来。
          ARCH: ${{ github.event.inputs.arch }}
        run: |
          x64='{"runner":"windows-2022","arch":"x64","target":"x86_64-pc-windows-msvc"}'
          arm='{"runner":"windows-11-arm","arch":"arm64","target":"aarch64-pc-windows-msvc"}'
          case "$ARCH" in
            x64)   targets="[$x64]" ;;
            arm64) targets="[$arm]" ;;
            *)     targets="[$x64,$arm]" ;;   # both
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # 版本跟随继承来的 release.yml —— 那是上游验证过能跑的组合，别自己挑。
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # rust-toolchain.toml 锁了 channel，这里只要补目标平台。
      - name: 装 Rust 工具链
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # 编译前先过一遍闸。Windows 上有一批 `#[cfg(target_os = "windows")]` 分支是 macOS
      # 开发时编译器根本看不到的，让它们在这里暴露，而不是在 tauri build 中途。
      - name: 编译检查（Windows 侧的 cfg 分支只有这里能验）
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: 打包
        # 只出 msi。nsis 那条要额外下载安装器工具链，给人试用不需要两种包。
        run: pnpm tauri build --target ${{ matrix.target }} --bundles msi

      - uses: actions/upload-artifact@v4
        with:
          name: LoongPort-windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
