name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-11-arm
            arch: arm64
          - os: macos-14
          # ⚠️ Linux 两条暂时摘掉，等维护者验证过 Linux 包再放回来：
          #   - os: ubuntu-22.04
          #   - os: ubuntu-22.04-arm
          #     arch: arm64
          #
          # 不能「留着让它失败」—— publish-release 是 `needs: release` 且没有
          # `if: always()`，任一 matrix 分支失败就会把它 skip 掉 ⇒ 连已经编好的
          # Windows / macOS 包也发不出去（fail-fast: false 只保证其它分支跑完，
          # 不改变汇总那步的 skip 行为）。
          # 放回来时把上面三行取消注释即可，下面那些 `if: runner.os == 'Linux'`
          # 的步骤一直都在，不用动。

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # 同 ci.yml：跟 `.node-version` 走。出正式包的这条腿更不该用与 CI 不同的 Node。
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            elfutils \
            xdg-utils
          # flatpak / flatpak-builder 2026-08-04 去掉 —— 上游那份 Flatpak 清单
          # （`flatpak/com.ccswitch.desktop.*`）通篇是 CC Switch 的 app id 与功能描述、
          # 且从来没有构建步骤调用它，已随开源清理一起删。真做 Linux 包时按 LoongPort
          # 自己的 app id 重新生成一份，比改那份快。
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup pnpm (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        # ARM64 这格不能用 `pnpm/action-setup`（那个 action 在 windows-11-arm 上装不上），
        # 所以单独装一次 pnpm。版本与上面那步的 `pnpm/action-setup` 保持一致。
        #
        # ⚠️ **不要走 corepack。** 那是继承来的写法，2026-08-04 连撞两个坑：
        #   1. `corepack prepare` 验签失败 —— Node 22.12.0 自带的 corepack 里烧死的
        #      npm registry 公钥已过期，registry 现在用新 key 签 pnpm ⇒
        #      `Internal Error: Cannot find matching keyid`。
        #   2. 想换新 corepack 也不行 —— `npm install -g corepack@<新版>` 报
        #      `EEXIST: C:\npm\prefix\yarn.cmd`（corepack 带 yarn/pnpm 的 shim，
        #      runner 镜像里已存在，npm 拒绝覆盖），且 0.35.0 还要 Node ^22.22.2
        #      而本仓钉 22.12.0 ⇒ `EBADENGINE`。
        # `npm install -g pnpm@<版本>` 不经过 corepack 的验签与 shim 机制，两个坑都不碰。
        #
        # `--force` 是为了第 2 个坑的同类情形：runner 镜像预装了 pnpm，`pnpm.cmd` 已存在
        # ⇒ 不加就同样报 EEXIST。这里覆盖它正是我们要的（要的就是钉住的那个版本）。
        run: |
          $ErrorActionPreference = 'Stop'
          npm install -g --force pnpm@10.12.3
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri signing key
        # 给**自动更新包**签名的密钥。2026-08-04 起真的在用（那天接上了自己的发布渠道：
        # 注册 updater 插件 + 配 `plugins.updater` 的自有 endpoints/pubkey +
        # 开 `createUpdaterArtifacts`）。secret 已配：`TAURI_SIGNING_PRIVATE_KEY`
        # 与 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`，minisign key id `4D82BF9D32D1F237`。
        #
        # **缺密钥仍然只跳过、不让 workflow 挂**，这条不变：那样至少还能出安装包
        # （只是不出 `.sig` ⇒ `assemble-latest-json` 会跳过上传 latest.json ⇒
        # 这一版的用户收不到自动更新，但装机与使用都不受影响）。
        # 原来上游那个 `exit 1` 等于让整条发布通道被一个 secret 卡死。
        #
        # ⚠️ **判空必须在 `run:` 里做，不能写成步骤级 `if: secrets.X != ''`** ——
        # `secrets` 上下文在步骤级 `if` 里**不可用**（同类陷阱：`matrix` 在 job 级 `if` 里
        # 也不可用，见 d237a7aa）。secret 经 `env:` 传进来再判，这也是避免注入的标准写法。
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "⚠️ 未配置 TAURI_SIGNING_PRIVATE_KEY —— 跳过更新包签名。"
            echo "   安装包照出，但不会有 .sig ⇒ 不上传 latest.json ⇒ 这一版收不到自动更新。"
            exit 0
          fi

          # 用 env 传进来的值，不直插 ${{ secrets.* }} —— 直插会把内容写进 shell 脚本文本，
          # 含特殊字符时可能破坏语法（也是 workflow 注入的标准防线）。
          RAW="$SIGNING_KEY"
          # 目标：提供正确的私钥“文件路径”给 Tauri CLI，避免内容解码歧义
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          # 情况 1：原始两行文本（第一行以 "untrusted comment:" 开头）
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ 使用原始两行密钥文件格式"
          else
            # 情况 2：整体被 base64 包裹（解包后应当是两行）
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
              echo "✅ 成功解码 base64 包裹密钥，已还原为两行文件"
            else
              # 情况 3：已是第二行（纯 Base64 一行）→ 构造两行文件
              if echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
                ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
                printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
                echo "✅ 使用一行 Base64 私钥，已构造两行文件"
              else
                echo "❌ TAURI_SIGNING_PRIVATE_KEY 格式无法识别：既不是两行原文，也不是其 base64，亦非一行 base64" >&2
                echo "密钥前10个字符: $(echo "$RAW" | head -c 10)..." >&2
                exit 1
              fi
            fi
          fi
          # 将“完整两行内容”作为环境变量注入（Tauri 支持传入完整私钥文本或文件路径）
          # 使用多行写入语法，保持换行以便解析
          # 将完整两行私钥内容进行 base64 编码，作为单行内容注入环境变量
          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          elif command -v openssl >/dev/null 2>&1; then
            KEY_B64=$(openssl base64 -A -in "$KEY_PATH")
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          if [ -z "$KEY_B64" ]; then
            echo "❌ 无法生成私钥 base64 内容" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "✅ Tauri signing key prepared"

      - name: Import Apple signing certificate
        # 与上一步同理：没配证书就跳过，而不是让整个 macOS job 挂掉。
        #
        # 原来这步在缺 secret 时必挂（`set -euo pipefail` + 空串喂给 base64 + 后面
        # `find-identity` 找不到身份就 `exit 1`），于是 macOS 那条腿永远出不了包。
        # 跳过之后出的是**未签名未公证**的包：本机编译能直接开，但经网络传给别人后
        # Gatekeeper 会拦（报「已损坏」而不是可绕过的「未知开发者」）。
        # 偿还路径：配齐上面那三个 secret（证书 + 公证凭据）后本步骤自动走签名分支。
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "○ 未配置 APPLE_CERTIFICATE —— 跳过 macOS 代码签名与公证（当前有意如此）。"
            echo "  产物可用但未签名：经网络分发时 Gatekeeper 会拦，接收方需执行一次"
            echo "  xattr -dr com.apple.quarantine /Applications/LoongPort.app"
            echo "  ⚠️ 别建议「右键→打开」：macOS 15 起已移除该绕行，且本包是**签名校验失败**"
            echo "  （ad-hoc + Sealed Resources=none）⇒ 报「已损坏」而非「未知开发者」，"
            echo "  那类连「仍要打开」都可能不出现。配齐 6 个 secret 即自动启用签名。"
            exit 0
          fi
          # Decode .p12 certificate from base64
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | (base64 --decode 2>/dev/null || base64 -D) > "$CERT_PATH"

          # Save original default keychain for cleanup
          ORIGINAL_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Dynamically resolve signing identity (must be "Developer ID Application")
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "❌ No 'Developer ID Application' identity found — listing all identities:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "✅ Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Cleanup certificate file
          rm -f "$CERT_PATH"

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        env:
          # ⚠️ **`APPLE_SIGNING_IDENTITY` 有意不在这里声明。**
          #
          # 上一步导入成功时已把它写进 `$GITHUB_ENV`，所以它本来就在 job 环境里；再补一行
          # `${{ env.APPLE_SIGNING_IDENTITY }}` 唯一的效果是**没配证书时把它声明成空串** ——
          # 而 tauri-bundler 判的是「这个环境变量存不存在」，不是「有没有值」⇒ 它认为要签名
          # ⇒ 拿空身份去调 `codesign` ⇒ `error: The specified item could not be found in
          # the keychain.` 必挂。
          #
          # 2026-08-04 用 `v3.19.2-rc.1` 演练时踩到：macOS 那格重试三次全红，日志里是
          # `APPLE_SIGNING_IDENTITY:` （空）+ `Signing with identity ""`。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # 同一个陷阱的另一半：上面三个 secret 没配时也是空串，而 bundler 见它们「存在」
          # 就会去公证 —— 未签名的包送公证必被 Apple 拒。所以未签名路径必须把它们抹掉，
          # 「留空」不等于「没有」。
          # 重试**只对签名+公证的构建有意义** —— 那条路会走网络（notarytool 提交 Apple），
          # 抖一下重来是对的。未签名构建全程离线，失败一定是确定性的（代码编不过、
          # bundler 配置不对），重试只会把同一个错重演一遍。
          #
          # 而这里重演的代价按 macOS 的 **10× 计费倍率**算：演练那次三轮全量重编耗 47 分钟
          # 真实时间 ⇒ 470 分钟额度 ⇒ 月配额的 23%，换来的信息量为零。
          max_attempts=3
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            # 同一个陷阱的另一半：上面三个 secret 没配时也是空串，而 bundler 见它们「存在」
            # 就会去公证 —— 未签名的包送公证必被 Apple 拒。「留空」不等于「没有」。
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            max_attempts=1
            echo "○ 未签名构建 —— 已抹掉三个 Apple 公证变量，且不重试（失败必为确定性）。"
          fi
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== macOS build/notarization attempt ${attempt}/${max_attempts} ==="
            if pnpm tauri build --target universal-apple-darwin; then
              echo "✅ macOS build/notarization succeeded"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ macOS build/notarization failed (${max_attempts} 次尝试用尽)" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS build/notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # ⚠️ 两个参数都不能省，x64 与 arm64 同构：
          #
          # `--bundles msi`：tauri.conf.json 的 bundle.targets 是 "all"，裸 build 会连 NSIS
          # 一起打，而 NSIS 要额外下载工具链（见 windows-build.yml 的注释）。给人试用只需 msi。
          #
          # `--target`：本仓用 per-user WiX 模板（src-tauri/wix/per-user-main.wxs，上游自带），
          # 在默认 target 目录布局下过不了 WiX 的 ICE 校验 ——
          # `error LGHT0204 : ICE38: Component ... installs to user profile. It must use
          # a registry key under HKCU as its KeyPath, not a file`。
          # 显式指定 target triple 换掉目录布局才能过（2026-08-03 在维护者 Windows 机上实测）。
          #
          # 改这里要连带改 "Prepare Windows Assets" 的 $targetRoot —— 带 --target 的产物落在
          # target/<triple>/release/ 而不是 target/release/，只改一处等于白改。
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build --target x86_64-pc-windows-msvc --bundles msi
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0

          # Locate bundle artifacts
          TAR_GZ=""; APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$TAR_GZ" ]   && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          # `.tar.gz` 是**自动更新产物**，由 `tauri.conf.json` 的
          # `bundle.createUpdaterArtifacts` 控制 —— 2026-08-04 起已开启，所以正常情况下
          # 它一定存在。这里仍不 `exit 1`（上游原本是）：缺它只意味着这一版收不到自动更新，
          # 而安装包本身是好的，不该因此让整条发布通道断掉。
          if [ -z "$TAR_GZ" ]; then
            echo "⚠️ 没有 .tar.gz 更新包产物（签名密钥未配？）—— 只发 .app / .dmg，这一版收不到自动更新"
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          # Staple notarization ticket to .app（Tauri 已公证过它）。
          # 未签名时没有公证票可 staple —— 那条路径下这步会失败，所以跟着签名条件走。
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            xcrun stapler staple "$APP_PATH"
            echo "✅ .app stapled"
          else
            echo "○ 未签名，跳过 stapler（没有公证票）"
          fi

          # 1) Collect .tar.gz (updater artifact) —— 没启用 updater 时它不存在，跳过
          if [ -n "$TAR_GZ" ]; then
            NEW_TAR_GZ="LoongPort-${VERSION}-macOS.tar.gz"
            cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
            [ -f "$TAR_GZ.sig" ] && cp "$TAR_GZ.sig" "release-assets/$NEW_TAR_GZ.sig" || echo ".sig for macOS not found yet"
            echo "macOS updater artifact copied: $NEW_TAR_GZ"
          fi

          # 2) Collect .app as zip
          NEW_ZIP="LoongPort-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create styled DMG with create-dmg (Tauri's built-in DMG styling doesn't work on CI)
          #
          # 未签名时**照样出 DMG**，只是不带 --codesign —— 原来这里 exit 1，等于「没证书就
          # 连包都不给你」。而未签名的 DMG 对自己测试、给能跑一条命令的人试用是够用的
          # （接收方执行一次 `xattr -dr com.apple.quarantine`；**别说「右键→打开」**，
          # macOS 15 起已移除该绕行，且本包是签名校验失败 ⇒ 报「已损坏」，
          # 同 "Import Apple signing certificate" 那步的跳过提示）。
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="LoongPort-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/LoongPort.app"

          # --codesign 只在有身份时加。用数组拼参数而不是拼字符串 ——
          # 后者在身份名含空格时会被词法拆开（"Developer ID Application: 某某 (TEAMID)" 必含空格）。
          #
          # ⚠️ 展开处必须写成 `${ARR[@]+"${ARR[@]}"}`，不能是裸的 `"${ARR[@]}"` ——
          # 本步骤有 `set -u`，而**空数组的展开会被当成「引用未定义变量」**：
          # macOS runner 上实测报 `CODESIGN_ARGS[@]: unbound variable` 后 exit 1
          # （2026-08-04，未签名路径正好走到数组为空那支 ⇒ 一定触发）。
          # bash 4.4+ 修了这个行为，但 macOS 自带的是 3.2，别指望。
          CODESIGN_ARGS=()
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            CODESIGN_ARGS=(--codesign "$APPLE_SIGNING_IDENTITY")
          else
            echo "○ 未签名，DMG 不做 codesign"
          fi

          create-dmg \
            --volname "LoongPort" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "LoongPort.app" 180 220 \
            --hide-extension "LoongPort.app" \
            --app-drop-link 480 220 \
            ${CODESIGN_ARGS[@]+"${CODESIGN_ARGS[@]}"} \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"

      - name: Notarize macOS DMG
        # 与签名校验同理：没签名的包送去公证必然被拒（Apple 要求先签名再公证）。
        # 判据同样用 `APPLE_SIGNING_IDENTITY` —— 它只在证书导入成功时才有值。
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -z "$DMG_PATH" ]; then
            echo "❌ No .dmg found in release-assets/ to notarize" >&2
            exit 1
          fi

          echo "=== Notarizing DMG: $DMG_PATH ==="
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== DMG notarization attempt ${attempt}/${max_attempts} ==="
            if xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "✅ DMG notarization succeeded"
              xcrun stapler staple "$DMG_PATH"
              echo "✅ DMG stapled"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ DMG notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ DMG notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Verify macOS code signing and notarization
        # 这步是**签名的配套校验**，没签名就没有签名可验（`codesign --verify` 当场失败）。
        # 所以跟着上面那步一起条件化：`APPLE_SIGNING_IDENTITY` 只在证书导入成功时被写进
        # `$GITHUB_ENV`，用它当「这次到底签没签」的判据 —— 比再判一次 secret 更准确
        # （证书配了但 find-identity 没找到 Developer ID 时也该跳过）。
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail

          # Verify .app (from Tauri bundle)
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found for verification" >&2
            exit 1
          fi
          echo "=== Verifying .app: $APP_PATH ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✅ codesign verification passed"
          spctl -a -t exec -vv "$APP_PATH"
          echo "✅ spctl assessment passed"
          xcrun stapler validate "$APP_PATH"
          echo "✅ .app stapler validation passed"

          # Verify .dmg (from release-assets/, created by create-dmg + notarized)
          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -n "$DMG_PATH" ]; then
            echo "=== Verifying .dmg: $DMG_PATH ==="
            codesign --verify --verbose=2 "$DMG_PATH"
            echo "✅ .dmg codesign verification passed"
            spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"
            echo "✅ .dmg spctl assessment passed"
            xcrun stapler validate "$DMG_PATH"
            echo "✅ .dmg stapler validation passed"
          else
            echo "❌ No .dmg found for verification — release would ship without verified DMG" >&2
            exit 1
          fi

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME  # e.g., v3.5.0
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          # 两个分支都带 target triple —— 构建步骤对 x64 也传了 `--target`（见那里的注释）,
          # 产物因此落在 target/<triple>/release/ 而不是 target/release/。
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/x86_64-pc-windows-msvc/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # MSI 安装器（+ `.sig`，仅在启用 updater 时才有，见下）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # 缺 MSI 对两个架构都是硬失败：原先 x64 只 Write-Warning，于是 release 会**静默**
          # 少一个 Windows 安装包（fail-fast: false 之下其它平台照常发完，没人注意到）。
          if ($null -eq $msi) {
            throw "No Windows MSI installer found under $targetRoot/bundle"
          }
          $dest = "LoongPort-$VERSION-Windows$assetSuffix.msi"
          Copy-Item $msi.FullName (Join-Path release-assets $dest)
          Write-Host "Installer copied: $dest"
          # `.sig` 缺失对两个架构都只是提示，不是失败：
          # updater 插件**有意未启用**（见 src-tauri/src/lib.rs 那段说明 —— 上游端点会把用户
          # 升级成 cc-switch），`createUpdaterArtifacts` 也没开，所以 `.sig` 现在必然不存在。
          # 原先 arm64 分支在这里 throw ⇒ 那个 job 必然失败。启用 updater 后它会自动出现。
          $sigPath = "$($msi.FullName).sig"
          if (Test-Path $sigPath) {
            Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
            Write-Host "Signature copied: $dest.sig"
          } else {
            Write-Host "○ 没有 .sig（签名密钥未配？updater 自 2026-08-04 起已启用），跳过"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          #
          # ⚠️ 这个名字由 **tauri.conf.json 的 `mainBinaryName`** 决定，不是 crate name。
          #
          # 2026-08-04 之前它叫 `cc-switch.exe`（Cargo 默认跟 `[package] name`），
          # 这里也曾写着「别改成 LoongPort.exe」—— 那句话在设了 `mainBinaryName` 之后
          # **已经反过来了**：现在 Tauri 会把产物重命名成 `LoongPort.exe`，
          # 还写 `cc-switch.exe` 才会让 Test-Path 落空 ⇒ 下面那条 throw 让整个 job 红
          # （硬失败是有意的，见那里）。
          #
          # ⚠️ 改这个名字要三处同步：`mainBinaryName`、这里、以及本机打包脚本
          # （build-scripts/win-collect.ps1 —— 它按 *.exe 通配所以不受影响，但注释里
          # 提到了这个名字）。crate name 仍是 `cc-switch`，**别去动它**（118 处引用、
          # 改了收益为零，见仓 CLAUDE.md「三点五」那节）。
          #
          # 路径复用上面的 $targetRoot，别再单独列一份候选路径：那份在 x64 加 `--target` 那次
          # 就已经过时了（还把空的 target/release/ 排在第一位）。同一事实两处写等着分叉。
          $exePath = Join-Path $targetRoot 'LoongPort.exe'
          # 缺 exe 对两个架构都是硬失败，理由同 MSI：release notes 承诺了绿色版，
          # 静默少一个包比整个 job 红更难发现。
          if (-not (Test-Path $exePath)) {
            throw "Portable exe not found: $exePath"
          }
          $portableDir = 'release-assets/LoongPort-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          $portableIniPath = Join-Path $portableDir 'portable.ini'
          $portableContent = if ($isArm64) {
            @(
              '# LoongPort portable ARM64 build marker',
              'portable=true',
              'arch=arm64'
            )
          } else {
            @(
              '# LoongPort portable build marker',
              'portable=true'
            )
          }
          $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
          $portableZip = "release-assets/LoongPort-$VERSION-Windows$assetSuffix-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Windows portable zip created: LoongPort-$VERSION-Windows$assetSuffix-Portable.zip"

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"  # e.g., v3.5.0
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # AppImage（`.sig` 仅在启用 updater 后才有 —— 现在有意未启用，见 src-tauri/src/lib.rs）
          #
          # 缺 AppImage 是硬失败：它是 Linux 的主推包，原先只往 stderr 写一行就继续，
          # 于是 release 会静默少掉这个平台的包而 job 仍然是绿的。
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found under target/release/bundle" >&2
            exit 1
          fi
          NEW_APPIMAGE="LoongPort-${VERSION}-Linux-${ARCH}.AppImage"
          cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
          if [ -f "$APPIMAGE.sig" ]; then
            cp "$APPIMAGE.sig" "release-assets/$NEW_APPIMAGE.sig"
          else
            echo "○ 没有 .sig（签名密钥未配？updater 自 2026-08-04 起已启用），跳过"
          fi
          echo "AppImage copied: $NEW_APPIMAGE"
          # 额外上传 .deb（用于手动安装，不参与 Updater）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/LoongPort-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: LoongPort-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "No .deb found (optional)"
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等，不参与 Updater）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/LoongPort-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: LoongPort-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "No .rpm found (optional)"
          fi

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

      - name: Clean up Apple signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: LoongPort ${{ github.ref_name }}
          # 由 tag 名决定，不再硬编码 —— `v3.19.2-rc.1` 这类带后缀的算预发布，
          # `v3.19.2` 算正式版。之前恒为 true，那会让正式首发也挂上 Pre-release 标记：
          # GitHub 不把预发布算作 Latest ⇒ `releases/latest` 拿不到它，而 README 的
          # 下载指引正是让人去 Releases 页拿最新版。
          prerelease: ${{ contains(github.ref_name, '-') }}
          # ⚠️ 下面的「下载」清单必须与 matrix 实际跑的平台一致 —— 列出不存在的文件名
          # 等于让用户照着下载然后 404。Linux 两条现在是注释状态，所以这里也没有 Linux；
          # 放回 matrix 时把那句「Linux 包暂未提供」换成 AppImage / .deb / .rpm 三件套说明。
          #
          # 那段 macOS「未签名 + xattr」说明是本 fork 自己的：上游写的是「已通过签名和公证」，
          # 那对 cc-switch 成立、对这里不成立。配齐上面三个 Apple secret 后本 workflow 会
          # 自动走签名分支，那时这段就该换掉。（备注写在这里而不是 body 里 —— body 是给
          # 下载者看的，维护者的待办放进去等于让每个 Release 页面都挂着一条内部备忘。）
          body: |
            ## LoongPort ${{ github.ref_name }}

            🌐 **唯一官方网站 / Only Official Website**: [loongport.dev](https://loongport.dev)

            把一个运营商账号变成 codex 可用的多档位供应商

            ### 下载

            - **macOS**: `LoongPort-${{ github.ref_name }}-macOS.dmg`（推荐）或 `LoongPort-${{ github.ref_name }}-macOS.zip`（解压即用）
            - **Windows (x86_64)**: `LoongPort-${{ github.ref_name }}-Windows.msi`（安装版）或 `LoongPort-${{ github.ref_name }}-Windows-Portable.zip`（绿色版）
            - **Windows (ARM64)**: `LoongPort-${{ github.ref_name }}-Windows-arm64.msi`（安装版）或 `LoongPort-${{ github.ref_name }}-Windows-arm64-Portable.zip`（绿色版）

            > Linux 包暂未提供。

            > 应用内会自动检查更新（启动后几秒，失败静默）；也可在「设置 → 关于」手动检查。
            > 免安装版不做原地更新 —— 它会带你回本页下载新版。

            ---
            ⚠️ **macOS 版本未经 Apple 签名与公证**（那需要 Apple Developer Program）。
            下载后 Gatekeeper 会拦，报「已损坏，应移到废纸篓」——**不是真的损坏**。
            打开「终端」执行一次即可：

            ```
            xattr -dr com.apple.quarantine /Applications/LoongPort.app
            ```

            ---
            ⚠️ **Windows：装新版本时若报「无法设置文件安全性 / could not set file security」**

            少数装了安全软件（如腾讯电脑管家）的机器上，**覆盖安装**旧版本会失败：

            ```
            could not set file security for file 'D:\Config.Msi\xxxxxxx.rbf'  Error: 5
            ```

            那是安全软件拦住了安装程序**备份旧文件**的动作，**不是安装包坏了**。
            两个办法，任选一个：

            1. **先卸载旧版本再装**（设置 → 应用 → 卸载 LoongPort，然后双击新安装包）。
               全新安装不需要备份旧文件，就不会被拦。**账号和配置不会丢** ——
               它们存在用户目录下，卸载不动它们，装回来仍是登录状态。
               <!-- 2026-08-04 在维护者的 Windows 机上实测过这条路：卸载 + 全新装
                    退出码 0，且 Config.Msi 里一个 .rbf 都没写（全新装无旧文件可备份
                    ⇒ 压根不触发那一步）；~/.loongport 前后都是 8 个文件。 -->
            2. **用绿色版**（上面的 `-Portable.zip`），解压即用，不经过 Windows 安装程序。

            > 首次安装的用户不会遇到这个 —— 它只在覆盖旧版本时出现。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: publish-release
    permissions:
      contents: write
    steps:
      - name: Prepare GH
        run: |
          gh --version || (type -p curl >/dev/null && sudo apt-get update && sudo apt-get install -y gh || true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true
      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"
          # 初始化空平台映射
          mac_url=""; mac_sig=""
          win_x64_url=""; win_x64_sig=""
          win_arm64_url=""; win_arm64_sig=""
          linux_x64_url=""; linux_x64_sig=""
          linux_arm64_url=""; linux_arm64_sig=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *.tar.gz)
                # 视为 macOS updater artifact
                mac_url="$url"; mac_sig="$sig_content";;
              *-Windows-arm64.msi)
                win_arm64_url="$url"; win_arm64_sig="$sig_content";;
              *-Windows.msi)
                win_x64_url="$url"; win_x64_sig="$sig_content";;
              *-Linux-arm64.AppImage|*-Linux-arm64.appimage)
                linux_arm64_url="$url"; linux_arm64_sig="$sig_content";;
              *-Linux-x86_64.AppImage|*-Linux-x86_64.appimage)
                linux_x64_url="$url"; linux_x64_sig="$sig_content";;
            esac
          done
          # 构造 JSON（仅包含存在的目标）
          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\",";
            echo "  \"notes\": \"Release $TAG\",";
            echo "  \"pub_date\": \"$PUB_DATE\",";
            echo '  "platforms": {'
            first=1
            if [ -n "$mac_url" ] && [ -n "$mac_sig" ]; then
              # 为兼容 arm64 / x64，重复写入两个键，指向同一 universal 包
              for key in darwin-aarch64 darwin-x86_64; do
                [ $first -eq 0 ] && echo ','
                echo "    \"$key\": {\"signature\": \"$mac_sig\", \"url\": \"$mac_url\"}"
                first=0
              done
            fi
            if [ -n "$win_x64_url" ] && [ -n "$win_x64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-x86_64\": {\"signature\": \"$win_x64_sig\", \"url\": \"$win_x64_url\"}"
              first=0
            fi
            if [ -n "$win_arm64_url" ] && [ -n "$win_arm64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"windows-aarch64\": {\"signature\": \"$win_arm64_sig\", \"url\": \"$win_arm64_url\"}"
              first=0
            fi
            if [ -n "$linux_x64_url" ] && [ -n "$linux_x64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-x86_64\": {\"signature\": \"$linux_x64_sig\", \"url\": \"$linux_x64_url\"}"
              first=0
            fi
            if [ -n "$linux_arm64_url" ] && [ -n "$linux_arm64_sig" ]; then
              [ $first -eq 0 ] && echo ','
              echo "    \"linux-aarch64\": {\"signature\": \"$linux_arm64_sig\", \"url\": \"$linux_arm64_url\"}"
              first=0
            fi
            echo '  }'
            echo '}'
          } > "$tmp_json"
          echo "Generated latest.json:" && cat "$tmp_json"
          # updater 未启用时一个 .sig 都不会有 ⇒ platforms 是空对象。那种 latest.json 传上去
          # 只会让人以为应用内更新已经能用（实际 lib.rs 里连插件都没注册），所以不传。
          # 启用 updater 后 .sig 自然出现，这里就会照常上传。
          if [ $first -eq 1 ]; then
            echo "○ 没有任何 .sig（updater 未启用）—— 不上传空的 latest.json"
            echo "SKIP_UPLOAD=1" >> "$GITHUB_ENV"
          fi
          mv "$tmp_json" latest.json
      - name: Upload latest.json to release
        if: env.SKIP_UPLOAD != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
