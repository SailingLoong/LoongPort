version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-deps:
        patterns:
          - "*"
    ignore:
      # v4 起 tailwind 不能再直接当 PostCSS 插件用（@tailwindcss/postcss 分家），
      # 本仓钉 v3 —— 升 v4 是一次独立的迁移工程，不吃依赖组的顺带升级。
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-deps:
        patterns:
          - "*"
    ignore:
      # zip 4→8 跨多个大版本，`..` 条目的处置语义变了（安全闸测试
      # extract_local_zip_rejects_dot_dot_entries 拦下）。升 8 要单独评估
      # 解压安全语义，不吃依赖组的顺带升级。
      - dependency-name: "zip"
        update-types:
          - "version-update:semver-major"
      # 下面两个是 tauri 官方工具链钉住的传递依赖，安全公告在我们树内无解
      # （latest-resolvable 低于修复版，security_update_not_possible 每天
      # 失败两单、发邮件）。两者都不是本仓直依赖，name 级 ignore 零附带损失；
      # tauri 上游升级后（kuchikiki/selectors 摆脱 phf 0.8、GTK 栈升 0.20）
      # 移除这两条恢复告警。
      - dependency-name: "rand"
      - dependency-name: "glib"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "actions"
    commit-message:
      prefix: "chore(deps)"
