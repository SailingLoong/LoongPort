version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-deps:
        patterns:
          - "*"
    ignore:
      # v4 起 tailwind 不能再直接当 PostCSS 插件用（@tailwindcss/postcss 分家），
      # 本仓钉 v3 —— 升 v4 是一次独立的迁移工程，不吃依赖组的顺带升级。
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-deps:
        patterns:
          - "*"
    ignore:
      # zip 4→8 跨多个大版本，`..` 条目的处置语义变了（安全闸测试
      # extract_local_zip_rejects_dot_dot_entries 拦下）。升 8 要单独评估
      # 解压安全语义，不吃依赖组的顺带升级。
      - dependency-name: "zip"
        update-types:
          - "version-update:semver-major"
      # rand/glib 的 tauri 结构性安全公告（selectors→phf 0.8 钉 rand 0.7、
      # GTK 0.18 栈钉 glib 0.18）曾每天失败两单发邮件——实测 ignore（含
      # name 级全区间）拦不住 security_update_not_possible（任务死在解析
      # 阶段、到不了 ignore 判定），最终靠仓库设置关 Dependabot security
      # updates 止噪（告警仍在 Security 页）。tauri 上游升级后可开回设置。

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "actions"
    commit-message:
      prefix: "chore(deps)"
