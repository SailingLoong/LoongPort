[workspace]
# `loongport-cli` 必须是**独立成员 crate**（2026-09-07 v6.17.0 事故修根）：
# tauri 打包器按 crate 名选主程序、`mainBinaryName` 只管改名、不认 cargo 的
# `default-run` —— 两个 [[bin]] 同仓时它会把 CLI 改名成主程序塞进 macOS/Windows
# 包（5MB 的 CLI 冒充 GUI，用户双击即退）。一 crate 一 bin 是 tauri 唯一的
# 确定性形状（tauri-apps/tauri#9180）。
members = ["cli"]

[workspace.package]
# 版本唯源：两个 crate 都从这里继承（`version.workspace = true`）。
# 发版 bump 时改这一处 + package.json + tauri.conf.json。
version = "6.17.1"

[package]
# ⚠️ crate name 保持上游的 `cc-switch`，别改 —— 118 处引用、改了收益为零
# （裁决见 CLAUDE.md「三点五」）。面向用户的二进制名走下方 [[bin]]
# （与 tauri.conf.json 的 `mainBinaryName` 同名，闸钉着）。
name = "cc-switch"
version.workspace = true
description = "同样的 Codex，成本省 95% 以上 —— 填一个域名、登录一次，其余自动配好"
authors = ["SailingLoong", "Jason Young"]
license = "MIT"
repository = "https://github.com/SailingLoong/LoongPort"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

# GUI 主程序：本 crate 唯一的 bin，名字必须等于 crate 名（`cc-switch`）——
# tauri 打包器**按 crate 名**找 `target/release/<crate 名>` 并把它改名为
# tauri.conf.json 的 `mainBinaryName`（"LoongPort"，错误信息原文："failed to
# rename app binary …/release/cc-switch"）。crate 里出现第二个 [[bin]] 会让它
# 改错对象：v6.17.0 的 macOS/Windows 包因此整包打成了 loongport-cli（5MB 的
# CLI 冒充 GUI，用户双击即退）—— 这就是 CLI 拆去独立成员 crate 的原因。
# `required-features` 保留给 `--no-default-features` 的纯库构建。
[[bin]]
name = "cc-switch"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# 图形界面全套：tauri 及其插件、剪贴板/开机自启/WebKitGTK 绑定。
# 关掉它构建的就是无 GUI 的库（+ loongport-cli），用于静态 musl 包——
# Ubuntu 20.04 等老发行版跑不了 GUI 二进制（webkit2gtk-4.1 缺失 +
# glibc 2.35 符号墙），CLI 是它们唯一的接入路径。
gui = [
    "tauri",
    "tauri-plugin-log",
    "tauri-plugin-opener",
    "tauri-plugin-process",
    "tauri-plugin-updater",
    "tauri-plugin-dialog",
    "tauri-plugin-store",
    "tauri-plugin-deep-link",
    "tauri-plugin-window-state",
    "tauri-plugin-single-instance",
    "arboard",
    "auto-launch",
    "webkit2gtk",
]
test-hooks = []

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
dirs = "6.0"
toml = "1.0"
toml_edit = "0.25"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
cookie = "0.18.1"
arboard = { version = "3.6", optional = true }
flate2 = "1"
brotli = "8"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "1.0"
rustls-native-certs = "0.8"
regex = "1.10"
scraper = "0.27"
rquickjs = { version = "0.12", features = ["array-buffer", "classes"] }
thiserror = "2.0"
anyhow = "1.0"
zip = "4.6"
serde_yaml = "0.9"
tempfile = "3"
url = "2.5"
auto-launch = { version = "0.6", optional = true }
once_cell = "1.21.3"
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.11"
# sha2 0.11 的输出类型（hybrid-array）不再实现 `LowerHex`，hex 编码统一走这个。
hex = "0.4"
# Ed25519 验签（远端配置的签名校验，见 `relay::remote_config`）。
#
# **显式依赖而不是蹭 rustls 带进来的那份**：间接依赖的版本不由我们控制，
# 上游哪天换 TLS 后端（aws-lc-rs 之类）它就消失了，而验签是安全边界不能这样断。
# 选 ring 而不是 ed25519-dalek：它已经在依赖树里（rustls 用它），
# 且 `lib.rs` 已经在调它的 crypto provider —— 零新增编译单元。
ring = "0.17"
hmac = "0.13"
json5 = "1.3"
json-five = "0.3.1"
sys-locale = "0.3"
psl = "2.1.229"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_16"], optional = true }

# musl 静态包（loongport-cli）专用：reqwest 的 default-tls（native-tls）在
# musl 下没有系统 openssl 可链，vendored 让它随包静态编进去。GUI 构建
# （gnu 目标）不走这段，TLS 行为零变化。
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
# 必须与主依赖同版本：两段同时命中这个 target 时，版本分叉会让依赖图里
# 同时出现 rquickjs 0.12/0.8 两个单元，rustc 对 `use rquickjs` 产生
# E0464（v3.27.0 发版实测）。同版本时 features 在两段间自动合并
# （array-buffer + classes + bindgen）。
rquickjs = { version = "0.12", features = ["bindgen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor"] }

# 依赖不生成调试信息（本 crate 仍保留），避免 target/debug 膨胀到几十 G
[profile.dev.package."*"]
debug = false

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "4"
tempfile = "3"
tauri = { version = "2.8.2", features = ["test"] }
