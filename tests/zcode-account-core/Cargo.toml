[package]
name = "loongport-zcode-account-core-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the product source itself; this harness contains no second implementation.
[lib]
path = "../../src-tauri/src/zcode_accounts/mod.rs"

[dependencies]
serde = "1.0"
serde_json = "1.0"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23"
sha2 = "0.11"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[workspace]
